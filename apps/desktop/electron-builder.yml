appId: com.giszhc.vips-thumbnail-desktop
productName: 瞬图压缩
copyright: Copyright © 2026 giszhc

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - feedback.secret.json
  - "!**/*.map"

asar: true

# 运行时读取的静态资源：反馈邮件内联应用图标（dev 直接从 renderer assets 读取同一文件）
extraResources:
  - from: src/renderer/src/assets/app-icon.png
    to: app-icon.png

# 仅保留中英文语言包，移除其余 50+ 种语言的 .pak（减小安装包体积）
electronLanguages:
  - zh-CN
  - en-US

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "vips-thumbnail-desktop-setup-${version}.exe"
  # 托盘图标：运行时从 resources 根目录读取
  extraResources:
    - from: build/icon.ico
      to: icon.ico

mac:
  target:
    - target: dmg
      arch:
        - universal
  icon: build/icon.icns
  category: public.app-category.photography
  darkModeSupport: true
  artifactName: "vips-thumbnail-desktop-${version}-${arch}.dmg"
  # 托盘图标（菜单栏 Status Item）：运行时从 resources 根目录读取
  extraResources:
    - from: build/tray-icon.png
      to: tray-icon.png
    - from: build/tray-icon@2x.png
      to: tray-icon@2x.png

dmg:
  title: "瞬图压缩 ${version}"
  # UDBZ = bzip2 压缩，比默认 UDZO(zlib) 体积更小
  format: UDBZ
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 瞬图压缩
  # 中文安装界面
  installerLanguages:
    - zh_CN
  language: 2052

# 不发布，仅本地打包
publish: null

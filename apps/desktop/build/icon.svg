    stroke-opacity="0.22"
    stroke-width="12"
  />

  <g filter="url(#panelShadow)">
    <rect x="216" y="216" width="592" height="592" rx="112" fill="url(#glass)"/>
    <rect
      x="224"
      y="224"
      width="576"
      height="576"
      rx="104"
      stroke="#FFFFFF"
      stroke-opacity="0.44"
      stroke-width="16"

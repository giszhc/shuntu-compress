<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
>
  <title>图片压缩应用图标</title>
  <desc>蓝色玻璃质感圆角图标，中央为图片画框，两侧箭头向内表示图片压缩。</desc>

  <defs>
    <linearGradient id="base" x1="240" y1="94" x2="784" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55A4FF"/>
      <stop offset="0.46" stop-color="#2477F2"/>
      <stop offset="1" stop-color="#1252C8"/>
    </linearGradient>

    <linearGradient id="glass" x1="292" y1="234" x2="730" y2="792" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="mountain" x1="292" y1="520" x2="620" y2="736" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72E2D0"/>
      <stop offset="1" stop-color="#39BEB2"/>
    </linearGradient>

    <linearGradient id="shine" x1="210" y1="110" x2="504" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="outerShadow" x="0" y="8" width="1024" height="1016" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#082B76" flood-opacity="0.28"/>
    </filter>

    <filter id="panelShadow" x="158" y="174" width="708" height="708" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08347F" flood-opacity="0.24"/>
    </filter>

    <clipPath id="appShape">
      <path d="M512 56C284 56 174 56 109 121C44 186 44 296 44 512C44 728 44 838 109 903C174 968 284 968 512 968C740 968 850 968 915 903C980 838 980 728 980 512C980 296 980 186 915 121C850 56 740 56 512 56Z"/>
    </clipPath>

    <clipPath id="photoFrame">
      <rect x="216" y="216" width="592" height="592" rx="112"/>
    </clipPath>
  </defs>

  <g filter="url(#outerShadow)">
    <path
      d="M512 56C284 56 174 56 109 121C44 186 44 296 44 512C44 728 44 838 109 903C174 968 284 968 512 968C740 968 850 968 915 903C980 838 980 728 980 512C980 296 980 186 915 121C850 56 740 56 512 56Z"
      fill="url(#base)"
    />
  </g>

  <g clip-path="url(#appShape)">
    <ellipse cx="304" cy="178" rx="424" ry="350" fill="url(#shine)"/>
    <path
      d="M92 770C286 862 542 888 936 768V968H92V770Z"
